<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RMC Admin — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #1a5276;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: #fff;
      border-radius: 12px;
      padding: 40px 36px;
      width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo h1 { font-size: 22px; font-weight: 800; color: #1a5276; }
    .logo p  { font-size: 12px; color: #7f8c8d; margin-top: 4px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: #7f8c8d; margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 10px 12px;
      border: 1px solid #dce3eb; border-radius: 7px;
      font-size: 14px; outline: none;
    }
    .form-group input:focus { border-color: #2e86c1; }
    .btn-login {
      width: 100%; padding: 11px;
      background: #1a5276; color: #fff;
      border: none; border-radius: 7px;
      font-size: 14px; font-weight: 700;
      cursor: pointer; margin-top: 6px;
    }
    .btn-login:hover { background: #154360; }
    .error-msg { color: #c0392b; font-size: 12px; text-align: center; margin-top: 10px; display: none; }
    .spinner { display: none; text-align: center; margin-top: 8px; color: #7f8c8d; font-size: 13px; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <h1>PNWHS RMC</h1>
      <p>Society Management System — Admin Portal</p>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="admin@pnwhs-rmc.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-login">Sign In</button>
      <div class="spinner" id="spinner">Signing in…</div>
      <div class="error-msg" id="error-msg">Invalid email or password.</div>
    </form>
  </div>
  <script>
    const API_BASE = '/api';
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn    = e.target.querySelector('.btn-login');
      const spinner = document.getElementById('spinner');
      const errEl  = document.getElementById('error-msg');
      btn.disabled = true;
      spinner.style.display = 'block';
      errEl.style.display   = 'none';
      try {
        const res = await fetch(API_BASE + '/auth?action=login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email:    document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('rmc_token', data.data.token);
          localStorage.setItem('rmc_user',  JSON.stringify(data.data.user));
          window.location.href = 'index.html';
        } else {
          errEl.textContent   = data.message || 'Login failed.';
          errEl.style.display = 'block';
        }
      } catch {
        errEl.textContent   = 'Server error. Please try again.';
        errEl.style.display = 'block';
      } finally {
        btn.disabled          = false;
        spinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
